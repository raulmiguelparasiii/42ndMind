name: Semantic grounding baseline diagnostic

on:
  push:
    branches:
      - 'diagnostic/semantic-grounding-baseline-20261019'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Semantic grounding run 1
        run: node semantic-grounding.test.js
      - name: Semantic grounding run 2
        run: node semantic-grounding.test.js
      - name: Semantic grounding run 3
        run: node semantic-grounding.test.js
