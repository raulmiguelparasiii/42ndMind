name: Semantic grounding baseline diagnostic

on:
  push:
    branches:
      - 'diagnostic/semantic-grounding-baseline-20261019'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    strategy:
      fail-fast: false
      matrix:
        ref:
          - '3faa915293fb431a0816b7bbba15b82505851474'
          - 'a165379c5e331d2709b45b300596712cc81eab12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Record exact source
        run: |
          echo "ref=${{ matrix.ref }}"
          git rev-parse HEAD
          git hash-object one-mind.js semantic-grounding.test.js
      - name: Semantic grounding
        run: node semantic-grounding.test.js
