name: Semantic grounding baseline diagnostic

on:
  push:
    branches:
      - 'diagnostic/semantic-grounding-baseline-20261019'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    strategy:
      fail-fast: false
      matrix:
        ref:
          - '242bf79481d641a69691f8434dcabead432c8735'
          - 'b18a5588114adddfbb0bae11dea6ac283beb2d23'
          - '1cacc61928ce8349ad1cd79d46f8128850c6f326'
          - 'b050c66fc8af22ab93fd2761cf77a1e61e90200d'
        node: ['20','24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Record exact source
        run: |
          echo "ref=${{ matrix.ref }} node=${{ matrix.node }}"
          git rev-parse HEAD
          git hash-object one-mind.js semantic-grounding.test.js
      - name: Semantic grounding
        run: node semantic-grounding.test.js
