name: Verify one-rule kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node one-rule.test.js
      - run: node recursive-recompression.test.js
      - run: node temporal-recompression.test.js
      - run: node sequence-recompression.test.js
      - run: node open-development.js
      - run: node open-development-scalar.js
      - run: node one-rule.stress.js
