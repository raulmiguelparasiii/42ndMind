name: Verify one-rule kernel

on:
  push:
    branches: [main]
    paths:
      - 'one-rule.js'
      - 'one-rule.test.js'
      - 'one-rule.stress.js'
      - 'recursive-recompression.js'
      - 'recursive-recompression.test.js'
      - 'temporal-recompression.test.js'
      - 'sequence-recompression.test.js'
      - 'open-development.js'
      - 'open-development-scalar.js'
      - 'micro-world-open.js'
      - 'one-mind.js'
      - 'one-mind.test.js'
      - 'relational-history-preservation.test.js'
      - 'micro-world.js'
      - 'micro-world-single-life.js'
      - '.github/workflows/one-rule.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: one-rule-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latest_commit:
    runs-on: ubuntu-latest
    outputs:
      run_root: ${{ steps.relevance.outputs.run_root }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: relevance
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_root=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(agi/|AGENTS\.md$|\.github/workflows/)' | grep -q .; then
            echo "run_root=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_root=false" >> "$GITHUB_OUTPUT"
          fi

  one-rule:
    needs: latest_commit
    if: needs.latest_commit.outputs.run_root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node one-rule.test.js
      - run: node recursive-recompression.test.js
      - run: node temporal-recompression.test.js
      - run: node sequence-recompression.test.js
      - run: node open-development.js
      - run: node open-development-scalar.js
      - run: node micro-world-open.js
      - run: node one-mind.test.js
      - run: node relational-history-preservation.test.js
      - run: node one-rule.stress.js
      - run: node micro-world-single-life.js
