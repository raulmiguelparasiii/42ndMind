name: AGI Gate Z work6 public battery
on:
  push:
    branches: [agi-eval-data-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch precommitted public ARC tasks
        env:
          SOURCE_HASH: c0719fa43f39e85603ec64b2fa19685ccb19274acb3484e41ad2c986fd26eec5
        run: |
          mkdir -p gate-z-work6
          for id in 3a25b0d8 2c181942 291dc1e1 3e6067c3; do
            curl -fsSL "https://raw.githubusercontent.com/arcprize/ARC-AGI-2/main/data/evaluation/${id}.json" -o "gate-z-work6/${id}.json"
          done
          cat > gate-z-work6/MANIFEST.txt <<'EOF'
          source_hash=c0719fa43f39e85603ec64b2fa19685ccb19274acb3484e41ad2c986fd26eec5
          selection_rule=successive 8-hex chunks of frozen source hash modulo sorted visible unused evaluation pool; remove each selected ID before next draw
          selected=3a25b0d8,2c181942,291dc1e1,3e6067c3
          outputs_used_for_selection=false
          EOF
          sha256sum gate-z-work6/*.json > gate-z-work6/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agi-gate-z-work6
          path: gate-z-work6
          if-no-files-found: error
