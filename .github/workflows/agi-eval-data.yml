name: AGI frozen-hash evaluation ferry
on:
  push:
    branches: [agi-eval-data-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ARC-AGI-2 evaluation split and select from frozen source hash
        env:
          SOURCE_HASH: 68aed7f38a78b5b20d2f383bbb50762c151acbe2f11a525fbab1b901bc279aa1
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-2.git arc-source
          mkdir -p frozen-eval
          python - <<'PY'
          import os, pathlib, shutil, hashlib
          root=pathlib.Path('arc-source/data/evaluation')
          excluded={'4cd1b7b2','ce4f8723','16de56c4','1ae2feb7','1818057f','13e47133','142ca369','20270e3b','136b0064','65b59efc','b0039139','446ef5d2','6e4f6532'}
          pool=[p for p in sorted(root.glob('*.json')) if p.stem not in excluded]
          if len(pool)<2: raise SystemExit(f'evaluation pool too small: {len(pool)}')
          h=os.environ['SOURCE_HASH']
          i=int(h[:16],16)%len(pool)
          j=int(h[16:32],16)%(len(pool)-1)
          if j>=i:j+=1
          chosen=[pool[i],pool[j]]
          out=pathlib.Path('frozen-eval')
          for p in chosen:shutil.copy2(p,out/p.name)
          (out/'MANIFEST.txt').write_text('source_hash='+h+'\nselection_rule=all previously unseen ARC-AGI-2 evaluation tasks; output-blind deterministic selection\nselection_pool='+str(len(pool))+'\nselected='+','.join(p.stem for p in chosen)+'\n')
          with (out/'SHA256SUMS.txt').open('w') as f:
              for p in chosen:f.write(hashlib.sha256((out/p.name).read_bytes()).hexdigest()+'  '+p.name+'\n')
          print((out/'MANIFEST.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-hash-agi-eval
          path: frozen-eval
          if-no-files-found: error
