name: AGI evaluation data ferry
on:
  push:
    branches: [agi-eval-data-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch precommitted public ARC tasks
        run: |
          mkdir -p eval-data
          curl -fsSL https://raw.githubusercontent.com/arcprize/ARC-AGI-2/main/data/evaluation/13e47133.json -o eval-data/13e47133.json
          curl -fsSL https://raw.githubusercontent.com/arcprize/ARC-AGI-2/main/data/evaluation/142ca369.json -o eval-data/142ca369.json
          sha256sum eval-data/*.json | tee eval-data/SHA256SUMS.txt
      - name: Fetch ARC public training split for development only
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-2.git arc-source
          mkdir -p arc-training
          cp arc-source/data/training/*.json arc-training/
          sha256sum arc-training/*.json | sort > arc-training/SHA256SUMS.txt
      - name: Stage ULT source snapshot
        run: |
          mkdir -p ult-source
          cp *.js ult-source/ 2>/dev/null || true
          cp AGENTS.md UNIVERSAL_LANGUAGE_TRACK.md ult-source/
          git rev-parse HEAD > ult-source/GIT_COMMIT.txt
          sha256sum ult-source/* | sort > ult-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agi-eval-data
          path: eval-data
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: arc-training-development
          path: arc-training
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ult-source-snapshot
          path: ult-source
          if-no-files-found: error
