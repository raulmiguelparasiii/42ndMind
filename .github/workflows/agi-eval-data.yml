name: AGI frozen-hash evaluation ferry
on:
  push:
    branches: [agi-eval-data-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ARC-AGI-2 evaluation split and select from frozen source hash
        env:
          SOURCE_HASH: 5cc4ac3a6e8a3fc0ce34c245b99920001e3741df6e64ac7fb18a7b6a4ac9365e
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-2.git arc-source
          mkdir -p frozen-eval
          python - <<'PY'
          import os, pathlib, shutil, hashlib
          root=pathlib.Path('arc-source/data/evaluation')
          excluded={'4cd1b7b2','ce4f8723','16de56c4','1ae2feb7','1818057f','13e47133','142ca369','20270e3b','136b0064'}
          files=sorted(p for p in root.glob('*.json') if p.stem not in excluded)
          h=os.environ['SOURCE_HASH']
          i=int(h[:16],16)%len(files)
          j=int(h[16:32],16)%(len(files)-1)
          if j>=i:j+=1
          chosen=[files[i],files[j]]
          out=pathlib.Path('frozen-eval')
          for p in chosen:shutil.copy2(p,out/p.name)
          manifest=out/'MANIFEST.txt'
          manifest.write_text('source_hash='+h+'\nselection_pool='+str(len(files))+'\nselected='+','.join(p.stem for p in chosen)+'\n')
          with (out/'SHA256SUMS.txt').open('w') as f:
            for p in chosen:
              f.write(hashlib.sha256((out/p.name).read_bytes()).hexdigest()+'  '+p.name+'\n')
          print(manifest.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-hash-agi-eval
          path: frozen-eval
          if-no-files-found: error
