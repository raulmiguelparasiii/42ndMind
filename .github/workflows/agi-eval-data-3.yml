name: AGI evaluation data ferry 3
on:
  push:
    branches: [agi-eval-data-20261018]
permissions:
  contents: read
jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch untouched ConceptARC public corpus
        run: |
          git clone --depth 1 https://github.com/victorvikram/ConceptARC.git conceptarc
          cp -r conceptarc/corpus conceptarc-corpus
          sha256sum $(find conceptarc-corpus -type f -name '*.json' | sort) > conceptarc-corpus/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: conceptarc-public-heldout
          path: conceptarc-corpus
          if-no-files-found: error
