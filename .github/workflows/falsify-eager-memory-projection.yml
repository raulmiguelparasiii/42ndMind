name: Falsify eager memory-shaped projection

on:
  push:
    branches: [canonical/retract-eager-memory-projection]
    paths:
      - 'one-mind.js'
      - 'relational-history-preservation.test.js'
      - '.github/workflows/falsify-eager-memory-projection.yml'

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node one-mind.test.js
      - run: node relational-history-preservation.test.js
