name: unified-relational-growth-v2

on:
  push:
    branches:
      - fix/unified-relational-growth-v2-20261011
    paths:
      - apply-first-class-growth-v2.js
      - optimize-first-class-growth-v2.js
      - relational-growth-v2-proof.js
      - unified-relational-observation.js
      - .github/workflows/unified-relational-growth-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-relational-growth-v2-20261011
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only incremental first-class growth
        run: |
          node apply-first-class-growth-v2.js
          node optimize-first-class-growth-v2.js
          node --check one-mind.js
      - name: Prove first-class relational growth
        run: timeout 90s node relational-growth-v2-proof.js
      - name: Preserve self-correction
        run: timeout 120s node one-mind.test.js
      - name: Preserve structured knowledge and no-cheat behavior
        run: timeout 120s node structured-knowledge.test.js
      - name: Preserve compositional language
        run: timeout 180s node language-school.test.js
      - name: Observe same 16-contact English-dependent life
        run: timeout 180s env SOCIAL_STEPS=16 REPORT_PATH=state/unified-relational-growth-v2-16.json node unified-relational-observation.js
      - name: Persist only after all gates pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add one-mind.js state/unified-relational-growth-v2-16.json
          git commit -m "Grow first-class relations incrementally from lived M"
          git pull --rebase origin fix/unified-relational-growth-v2-20261011
          git push origin HEAD:fix/unified-relational-growth-v2-20261011
