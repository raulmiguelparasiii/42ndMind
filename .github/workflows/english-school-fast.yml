name: English correlation school fast

on:
  pull_request:
    paths:
      - 'english-school.js'
      - 'english-school-runner.js'
      - '.github/workflows/english-school-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node english-school-runner.js
