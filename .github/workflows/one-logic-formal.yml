name: one-logic-formal

on:
  push:
    paths:
      - 'formal/**'
      - 'tests/test_one_logic.py'
      - '.github/workflows/one-logic-formal.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'tests/test_one_logic.py'
      - '.github/workflows/one-logic-formal.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and exhaustive bounded attacks
        run: python -m unittest discover -s tests -v
      - name: Full bounded falsifier
        run: PYTHONPATH=formal python -m one_logic.falsifier
