name: Diagnose unified mind

on:
  push:
    branches: [main]
    paths:
      - 'one-mind.js'
      - 'one-mind.test.js'
      - 'structured-knowledge.test.js'
      - 'semantic-grounding.test.js'
      - 'language-school.test.js'
      - 'language-world-life.test.js'
      - 'micro-world.js'
      - 'micro-world-single-life.js'
      - '.github/workflows/mind-smoke.yml'
  workflow_dispatch:

concurrency:
  group: mind-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node one-mind.test.js
      - run: node structured-knowledge.test.js
      - run: node semantic-grounding.test.js
      - run: node language-school.test.js
      - run: node language-world-life.test.js
      - run: SEEDS=420070 DEVELOPMENT_STEPS=64 AUTONOMOUS_STEPS=32 node micro-world-single-life.js
