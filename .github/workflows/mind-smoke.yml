name: Diagnose unified mind

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mind-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node one-mind.test.js
      # One continuous individual. This bounded run is for falsifying whether C
      # actually supplies any grounded motor continuation before paying the cost
      # of a long-life benchmark. It is not a score threshold and does not alter
      # the world or mind architecture.
      - run: SEEDS=420070 DEVELOPMENT_STEPS=64 AUTONOMOUS_STEPS=32 node micro-world-single-life.js
