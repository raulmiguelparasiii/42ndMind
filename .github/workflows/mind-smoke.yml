name: Diagnose unified mind

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mind-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node one-mind.test.js
      # One continuous individual: enough protected development to form reusable
      # structure, followed immediately by autonomous life. This is diagnostic,
      # not a pass/fail score threshold; poor behavior must remain visible.
      - run: SEEDS=420070 DEVELOPMENT_STEPS=120 AUTONOMOUS_STEPS=80 node micro-world-single-life.js
