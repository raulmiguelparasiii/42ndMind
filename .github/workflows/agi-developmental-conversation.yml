name: AGI developmental conversation
on:
  push:
    branches: [experiment/one-live-m-prose-learning-20261023]
    paths:
      - 'agi/surface-dialogue.js'
      - 'agi/live-mind.js'
      - 'agi/develop-and-converse.js'
      - '.github/workflows/agi-developmental-conversation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  develop-and-converse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grow one M and converse
        env:
          MIND_STATE_OUT: ${{ runner.temp }}/grown-M.json
        run: |
          set -euo pipefail
          node agi/develop-and-converse.js
      - name: Preserve grown individual
        uses: actions/upload-artifact@v4
        with:
          name: grown-M
          path: ${{ runner.temp }}/grown-M.json
          retention-days: 30
          compression-level: 9
