name: Anti-cheat universal language

on:
  pull_request:
    paths:
      - 'universal-language.js'
      - 'relational-math.js'
      - 'stone-closed-math.js'
      - 'stone-reality-contact.js'
      - 'relation-hypotheses.js'
      - 'anti-cheat-language.test.js'
      - 'wide-opaque-english.test.js'
      - 'wide-opaque-english-2.test.js'
      - 'mathematical-intent.test.js'
      - 'wide-mathematical-intent.test.js'
      - 'stone-pole-math.test.js'
      - 'stone-closed-math.test.js'
      - 'empathy-reality-contact.test.js'
      - 'relation-hypotheses.test.js'
      - 'UNIVERSAL_LANGUAGE_TRACK.md'
      - 'STONE_CLOSED_MATH_DESIGN.md'
      - '.github/workflows/anti-cheat-language.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node anti-cheat-language.test.js
      - run: node wide-opaque-english.test.js
      - run: node wide-opaque-english-2.test.js
      - run: node mathematical-intent.test.js
      - run: node wide-mathematical-intent.test.js
      - run: node stone-pole-math.test.js
      - run: node stone-closed-math.test.js
      - run: node empathy-reality-contact.test.js
      - run: node relation-hypotheses.test.js
