name: Anti-cheat universal language

on:
  pull_request:
    paths:
      - 'universal-language.js'
      - 'relational-math.js'
      - 'stone-closed-math.js'
      - 'stone-reality-contact.js'
      - 'stone-referent-frame.js'
      - 'stone-universal-kernel.js'
      - 'universal-math-graph.js'
      - 'universal-math-types.js'
      - 'abstract-intent-kernel.js'
      - 'cognitive-relation-candidates.js'
      - 'recursive-intent-composition.js'
      - 'math-hypotheses.js'
      - 'english-math-bridge.js'
      - 'universal-intent.js'
      - 'universal-relation-reuse.js'
      - 'universal-relational-completion.js'
      - 'relational-history-resolution.js'
      - 'relational-history-abstraction.js'
      - 'relational-cue-accessibility.js'
      - 'relational-source-coherence.js'
      - 'universal-live-proposer.js'
      - 'relation-hypotheses.js'
      - 'relational-normal-form.js'
      - 'anti-cheat-language.test.js'
      - 'wide-opaque-english.test.js'
      - 'wide-opaque-english-2.test.js'
      - 'mathematical-intent.test.js'
      - 'wide-mathematical-intent.test.js'
      - 'stone-pole-math.test.js'
      - 'stone-closed-math.test.js'
      - 'empathy-reality-contact.test.js'
      - 'stone-referent-frame.test.js'
      - 'stone-universal-kernel.test.js'
      - 'abstract-intent-kernel.test.js'
      - 'cognitive-relation-candidates.test.js'
      - 'cognitive-english-live.test.js'
      - 'universal-math-types.test.js'
      - 'recursive-intent-composition.test.js'
      - 'math-hypotheses.test.js'
      - 'meaning-space.test.js'
      - 'universal-intent.test.js'
      - 'universal-relational-completion.test.js'
      - 'relational-history-resolution.test.js'
      - 'relational-history-abstraction.test.js'
      - 'cue-accessibility-interference.test.js'
      - 'source-coherence-reconstruction.test.js'
      - 'source-binding-coherence.test.js'
      - 'recurrence-guided-proposal.test.js'
      - 'live-episodic-reaccess.test.js'
      - 'natural-language-episodic-frontier.test.js'
      - 'universal-live-proposer.test.js'
      - 'abstract-english-math.test.js'
      - 'relation-hypotheses.test.js'
      - 'relational-normal-form.test.js'
      - 'UNIVERSAL_LANGUAGE_TRACK.md'
      - 'STONE_CLOSED_MATH_DESIGN.md'
      - '.github/workflows/anti-cheat-language.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node abstract-english-math.test.js
      - run: node anti-cheat-language.test.js
      - run: node wide-opaque-english.test.js
      - run: node wide-opaque-english-2.test.js
      - run: node mathematical-intent.test.js
      - run: node wide-mathematical-intent.test.js
      - run: node stone-pole-math.test.js
      - run: node stone-closed-math.test.js
      - run: node empathy-reality-contact.test.js
      - run: node stone-referent-frame.test.js
      - run: node stone-universal-kernel.test.js
      - run: node abstract-intent-kernel.test.js
      - run: node cognitive-relation-candidates.test.js
      - run: node cognitive-english-live.test.js
      - run: node universal-math-types.test.js
      - run: node recursive-intent-composition.test.js
      - run: node math-hypotheses.test.js
      - run: node meaning-space.test.js
      - run: node universal-intent.test.js
      - run: node universal-relational-completion.test.js
      - run: node relational-history-resolution.test.js
      - run: node relational-history-abstraction.test.js
      - run: node cue-accessibility-interference.test.js
      - run: node source-coherence-reconstruction.test.js
      - run: node source-binding-coherence.test.js
      - run: node recurrence-guided-proposal.test.js
      - run: node live-episodic-reaccess.test.js
      - run: node natural-language-episodic-frontier.test.js
      - run: node universal-live-proposer.test.js
      - run: node relation-hypotheses.test.js
      - run: node relational-normal-form.test.js

# Cross-occurrence recurrence remains proposal-only. This gate checks whether a
# complete recurrence clue can enter the existing proposer path without becoming
# its own evidence, truth, status, or semantic-generalization authority.
