name: Frozen long-life cross-domain certification v2

on:
  push:
    branches:
      - experiment/one-live-m-architecture-20261020
    paths:
      - 'agi/post-freeze-long-life-cross-domain-certification-v2.test.js'
      - '.github/workflows/agi-long-life-certification-v2.yml'

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify refrozen cognition boundary
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=d72b7edd7aa21523d7a3a167688d599f02838929
          test "$(git rev-parse HEAD^)" = "$FREEZE"
          changed="$(git diff --name-only "$FREEZE" HEAD)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(agi/post-freeze-long-life-cross-domain-certification-v2\.test\.js|\.github/workflows/agi-long-life-certification-v2\.yml)$' || true)"
          test -z "$bad"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run held-out crossed-role long-life certification
        run: node agi/post-freeze-long-life-cross-domain-certification-v2.test.js
