name: Test unified outward completion

on:
  push:
    branches:
      - fix/unified-outward-completion-20261010
    paths:
      - '.github/scripts/apply_unified_outward_completion.py'
      - '.github/workflows/unified-outward-completion.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run passing baseline regressions
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
          node language-school.test.js
          node micro-world-single-life.js

      - name: Record known baseline semantic failure
        shell: bash
        run: |
          set +e
          node semantic-grounding.test.js > baseline-semantic.log 2>&1
          status=$?
          echo "baseline_semantic_status=$status"
          test "$status" -ne 0

      - name: Apply architectural correction
        run: python .github/scripts/apply_unified_outward_completion.py

      - name: Verify outward source is in M current
        run: |
          node --check one-mind.js
          grep -q 'function groundedContinuation' one-mind.js
          ! grep -q 'function groundedCompletion' one-mind.js
          grep -q 'state.current.continuation' one-mind.js
          ! grep -q 'state.motor = completion == null' one-mind.js

      - name: Run same passing regressions after correction
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
          node language-school.test.js
          node micro-world-single-life.js

      - name: Confirm semantic failure was pre-existing
        shell: bash
        run: |
          set +e
          node semantic-grounding.test.js > patched-semantic.log 2>&1
          status=$?
          echo "patched_semantic_status=$status"
          test "$status" -ne 0
          grep -q 'corrected cat concept -> English relation did not form' baseline-semantic.log
          grep -q 'corrected cat concept -> English relation did not form' patched-semantic.log

      - name: Persist tested runtime on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add one-mind.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Unify outward continuation with M current [skip ci]'
          git push origin HEAD:fix/unified-outward-completion-20261010
