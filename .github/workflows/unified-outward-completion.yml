name: Test unified outward completion

on:
  push:
    branches:
      - fix/unified-outward-completion-20261010
    paths:
      - '.github/scripts/apply_unified_outward_completion.py'
      - '.github/workflows/unified-outward-completion.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Apply architectural correction
        run: python .github/scripts/apply_unified_outward_completion.py

      - name: Verify one completion authority
        run: |
          node --check one-mind.js
          grep -q 'function completeRelationalValues' one-mind.js
          grep -q 'function groundedContinuation' one-mind.js
          ! grep -q 'function groundedCompletion' one-mind.js
          grep -q 'state.current.continuation' one-mind.js

      - name: Run established regressions
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
          node semantic-grounding.test.js
          node language-school.test.js
          node micro-world-single-life.js

      - name: Persist tested runtime on branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add one-mind.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Unify outward continuation with relational completion [skip ci]'
          git push origin HEAD:fix/unified-outward-completion-20261010
