name: AGI intent-grounded language certification

on:
  push:
    branches:
      - experiment/one-live-m-prose-learning-20261023
    paths:
      - 'agi/intent-grounded-language-acquisition.test.js'
      - 'agi/generic-lived-occurrences.js'
      - 'agi/relation-sequence-recompression.js'
      - 'agi/surface-relation-grounding.js'
      - 'agi/mind.js'
      - '.github/workflows/agi-prose-reasoning-certification.yml'
  workflow_dispatch:

concurrency:
  group: agi-intent-language-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Intent-grounded language acquisition
        shell: bash
        run: |
          set +e
          node agi/intent-grounded-language-acquisition.test.js > /tmp/intent-language.log 2>&1
          code=$?
          tail -n 160 /tmp/intent-language.log
          exit $code
