name: AGI grounded English certification

on:
  push:
    branches:
      - experiment/one-live-m-prose-learning-20261023
    paths:
      - 'agi/grounded-english-math-curriculum.test.js'
      - 'agi/raw-proposal-expression-grounding.js'
      - 'agi/surface-structure-grounding.js'
      - 'agi/raw-concept-definition.js'
      - 'agi/mind.js'
      - '.github/workflows/agi-prose-reasoning-certification.yml'
  workflow_dispatch:

concurrency:
  group: agi-grounded-english-${{ github.ref }}
  cancel-in-progress: true

jobs:
  english:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grounded English from mathematics
        run: node agi/grounded-english-math-curriculum.test.js
