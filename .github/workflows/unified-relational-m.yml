name: unified-relational-m

on:
  push:
    branches:
      - fix/unified-relational-m-20261011
    paths:
      - .github/workflows/unified-relational-m.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-and-observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-relational-m-20261011
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve clean runtime and observe baseline
        run: |
          cp one-mind.js /tmp/one-mind-baseline.js
          MIND_MODULE=/tmp/one-mind-baseline.js SOCIAL_STEPS=64 REPORT_PATH=state/unified-relational-baseline.json node unified-relational-observation.js

      - name: Apply only the unified relational correction
        run: |
          node apply-unified-relational-m.js
          node - <<'NODE'
          const fs = require('fs');
          const p = 'one-mind.js';
          let s = fs.readFileSync(p, 'utf8');
          const old = "function groundedContinuation(state, frame) {\n  if (state.experiences.length < 4 || !state.structure.patterns.length) return null;";
          const next = "function groundedContinuation(state, frame) {";
          if (!s.includes(old)) throw new Error('groundedContinuation guard not found');
          s = s.replace(old, next);
          fs.writeFileSync(p, s);
          NODE
          node --check one-mind.js

      - name: Observe the same life after the correction
        run: |
          SOCIAL_STEPS=64 REPORT_PATH=state/unified-relational-fixed.json node unified-relational-observation.js

      - name: Run unchanged regression gates
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
          node language-school.test.js

      - name: Compare semantic regression without hiding pre-existing failure
        shell: bash
        run: |
          set +e
          node semantic-grounding.test.js > /tmp/fixed-semantic.log 2>&1
          fixed=$?
          cp one-mind.js /tmp/one-mind-fixed.js
          cp /tmp/one-mind-baseline.js one-mind.js
          node semantic-grounding.test.js > /tmp/baseline-semantic.log 2>&1
          baseline=$?
          cp /tmp/one-mind-fixed.js one-mind.js
          cat /tmp/baseline-semantic.log
          cat /tmp/fixed-semantic.log
          echo "baseline_semantic_exit=$baseline fixed_semantic_exit=$fixed"
          if [ "$baseline" -eq 0 ] && [ "$fixed" -ne 0 ]; then
            echo 'Correction introduced a semantic regression.' >&2
            exit 1
          fi
          exit 0

      - name: Persist successful branch result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add one-mind.js state/unified-relational-baseline.json state/unified-relational-fixed.json
          git commit -m "Unify lived relations in M and record direct improvement"
          git push origin HEAD:fix/unified-relational-m-20261011
