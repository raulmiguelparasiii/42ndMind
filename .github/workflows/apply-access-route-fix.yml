name: Temporary semantic behavior probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-access-route-fix.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node .github/scripts/semantic_behavior_probe.js
