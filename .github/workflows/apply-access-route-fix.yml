name: Apply generic access-route retention fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-access-route-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply generic retention correction
        run: python .github/scripts/apply_access_route_fix.py
      - name: Run core and language regressions
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
          node semantic-grounding.test.js
          node language-school.test.js
          node language-world-life.test.js
          SEEDS=420070 DEVELOPMENT_STEPS=64 AUTONOMOUS_STEPS=32 node micro-world-single-life.js
      - name: Commit verified correction
        run: |
          rm .github/scripts/apply_access_route_fix.py
          rm .github/workflows/apply-access-route-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve independent warranted access routes'
          git push origin HEAD:main
