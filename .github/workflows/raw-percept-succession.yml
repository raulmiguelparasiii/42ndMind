name: Verify raw percept succession

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raw-percept-succession.yml'
      - '.github/scripts/raw_percept_succession.test.js'
      - '.github/scripts/apply_raw_percept_succession.py'
      - 'one-mind.js'

permissions:
  contents: write

jobs:
  falsify-patch-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Prove the generic defect before changing C
        if: ${{ hashFiles('.github/scripts/apply_raw_percept_succession.py') != '' }}
        run: |
          if node .github/scripts/raw_percept_succession.test.js; then
            echo 'Falsification unexpectedly passed before the representation correction.'
            exit 1
          fi
          echo 'Baseline falsified as expected: raw same-channel succession is missing.'

      - name: Apply only the generic representation correction
        if: ${{ hashFiles('.github/scripts/apply_raw_percept_succession.py') != '' }}
        run: |
          python .github/scripts/apply_raw_percept_succession.py
          python - <<'PY'
          from pathlib import Path
          p = Path('one-mind.js')
          s = p.read_text()
          s = s.replace(r'/^§t(\\d+)$/', r'/^§t(\d+)$/')
          s = s.replace(r'/^p(\\d+)$/', r'/^p(\d+)$/')
          p.write_text(s)
          PY

      - name: Verify raw succession, grounding, order, and persistence
        run: node .github/scripts/raw_percept_succession.test.js

      - name: Run established regressions
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
          node semantic-grounding.test.js
          node language-school.test.js
          node language-world-life.test.js
          SEEDS=420070 DEVELOPMENT_STEPS=64 AUTONOMOUS_STEPS=32 node micro-world-single-life.js

      - name: Commit only after every gate passes
        if: ${{ hashFiles('.github/scripts/apply_raw_percept_succession.py') != '' }}
        run: |
          rm .github/scripts/apply_raw_percept_succession.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Represent and stabilize raw percept succession'
          git push origin HEAD:main
