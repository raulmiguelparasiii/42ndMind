name: Verify raw percept succession

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run focused diagnostic only when explicitly requested
        run: node .github/scripts/raw_percept_succession.test.js
