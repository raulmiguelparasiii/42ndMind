name: Repair semantic retention regression

on:
  push:
    branches:
      - 'repair/semantic-retention-regression-20261020'
    paths:
      - '.github/workflows/repair-semantic-retention.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply candidate retention correction
        run: python .github/scripts/repair_semantic_retention.py
      - name: Canonical core and no-cheat knowledge
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
      - name: Semantic acquisition and correction
        run: node semantic-grounding.test.js
      - name: Compositional language
        run: node language-school.test.js
      - name: Variable-length independent access routes
        run: node language-world-life.test.js
      - name: Embodied single-life regression
        run: SEEDS=420070 DEVELOPMENT_STEPS=64 AUTONOMOUS_STEPS=32 node micro-world-single-life.js
      - name: Commit only after all preserved gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add one-mind.js
          git commit -m 'Restore grounded semantic correction under route retention'
          git push origin HEAD:repair/semantic-retention-regression-20261020
