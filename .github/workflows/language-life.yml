name: Falsify continuous language life

on:
  push:
    branches: [main]
    paths:
      - 'one-mind.js'
      - 'language-world-life.test.js'
      - '.github/workflows/language-life.yml'
  workflow_dispatch:

concurrency:
  group: language-life-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  language-life:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node language-world-life.test.js
