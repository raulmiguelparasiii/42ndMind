name: AGI continue grown conversation
on:
  push:
    branches: [experiment/one-live-m-prose-learning-20261023]
    paths:
      - 'agi/mind.js'
      - 'agi/generic-lived-occurrences.js'
      - 'agi/structural-relational-abstraction.js'
      - 'agi/structural-open-relations.js'
      - 'agi/surface-dialogue.js'
      - 'agi/surface-social-grounding.js'
      - 'agi/claim-stability.js'
      - 'agi/surface-turn-completion.js'
      - 'agi/surface-relation-grounding.js'
      - 'agi/affected-relational-field.js'
      - 'agi/whole-being.js'
      - 'agi/situated-reality-contact.js'
      - 'agi/self-surface-occurrence.js'
      - 'agi/live-mind.js'
      - 'agi/continue-grown-conversation-4.js'
      - 'agi/converse-reflective-bridge.js'
      - 'agi/converse-support-edge-probe.js'
      - 'agi/converse-teach-reflection.js'
      - '.github/workflows/agi-continue-grown-conversation.yml'
  workflow_dispatch:
concurrency:
  group: agi-continue-grown-conversation
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  continue-conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover the support-edge saved individual
        uses: actions/download-artifact@v4
        with:
          name: continued-M9-support-edge-probe
          path: ${{ runner.temp }}/continued
          github-token: ${{ github.token }}
          repository: raulmiguelparasiii/42ndMind
          run-id: 40165870540
      - name: Teach reflective support through ordinary conversation
        env:
          MIND_STATE_IN: ${{ runner.temp }}/continued/continued-M9-support-edge-probe.json
          MIND_STATE_OUT: ${{ runner.temp }}/continued-M10-taught-reflection.json
        run: |
          set -euo pipefail
          node agi/converse-teach-reflection.js
      - name: Preserve the taught continuation
        uses: actions/upload-artifact@v4
        with:
          name: continued-M10-taught-reflection
          path: ${{ runner.temp }}/continued-M10-taught-reflection.json
          retention-days: 30
          compression-level: 9
