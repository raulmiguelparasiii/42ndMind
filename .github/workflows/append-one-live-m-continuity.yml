name: Append one-live-M continuity

on:
  push:
    branches:
      - 'experiment/one-live-m-architecture-20261020'
    paths:
      - '.github/one-live-m-continuity-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: experiment/one-live-m-architecture-20261020
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Append bounded continuity records
        run: python .github/append-one-live-m-continuity.py
      - name: Commit continuity authority updates and remove one-off scaffolding
        run: |
          git config user.name "42ndMind continuity bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/append-one-live-m-continuity.yml .github/one-live-m-continuity-trigger .github/append-one-live-m-continuity.py
          git add AGENTS.md UNIVERSAL_LANGUAGE_TRACK.md
          git commit -m "Record PR47 and one-live-M architecture"
          git push origin HEAD:experiment/one-live-m-architecture-20261020
