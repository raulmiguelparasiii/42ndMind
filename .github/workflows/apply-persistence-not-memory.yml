name: Apply persistence-only canonical correction

on:
  push:
    branches: [canonical/retract-eager-memory-projection]
    paths:
      - '.github/scripts/apply_persistence_not_memory.py'
      - '.github/workflows/apply-persistence-not-memory.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply persistence-only correction
        run: python .github/scripts/apply_persistence_not_memory.py
      - name: Run corrected invariant
        run: node relational-history-preservation.test.js
      - name: Run relevant canonical regressions
        run: |
          node one-mind.test.js
          node structured-knowledge.test.js
          node temporal-recompression.test.js
          node sequence-recompression.test.js
          node one-rule.stress.js
      - name: Commit only if every gate passed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep persistence in M without eager memory projection'
          git push origin HEAD:canonical/retract-eager-memory-projection
