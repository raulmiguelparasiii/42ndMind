name: Temporary semantic correction probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/semantic-correction-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inspect competing correction routes
        run: node .github/scripts/semantic_correction_probe.js
