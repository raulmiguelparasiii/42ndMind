name: Apply occurrence-aware relational completion

on:
  push:
    branches: [canonical/occurrence-aware-C-test]
    paths:
      - '.github/scripts/apply_occurrence_aware_completion.py'
      - '.github/workflows/apply-occurrence-aware-completion.yml'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply generic occurrence-aware completion repair
        run: python .github/scripts/apply_occurrence_aware_completion.py
      - name: Run the preserved falsification
        run: node relational-occurrence-completion.test.js
      - name: Run canonical authority regressions
        run: |
          node structured-knowledge.test.js
          node one-mind.test.js
          node temporal-recompression.test.js
          node sequence-recompression.test.js
      - name: Commit only if every gate passed
        run: |
          rm .github/scripts/apply_occurrence_aware_completion.py
          rm .github/workflows/apply-occurrence-aware-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make canonical relational completion occurrence-aware'
          git push origin HEAD:canonical/occurrence-aware-C-test
