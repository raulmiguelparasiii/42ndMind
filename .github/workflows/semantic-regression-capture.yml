name: Verify semantic grounding candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/semantic-regression-capture.yml'
      - '.github/scripts/apply_current_temporal_contact_guard.py'
      - '.github/scripts/apply_temporal_definition_guard.py'

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Apply exact staged candidate
        run: |
          python .github/scripts/apply_raw_percept_succession.py
          python - <<'PY'
          from pathlib import Path
          p = Path('one-mind.js')
          s = p.read_text()
          s = s.replace(r'/^§t(\\d+)$/', r'/^§t(\d+)$/')
          s = s.replace(r'/^p(\\d+)$/', r'/^p(\d+)$/')
          p.write_text(s)
          PY
          python .github/scripts/apply_grounded_completion_guard.py
          python .github/scripts/apply_current_temporal_contact_guard.py
          python .github/scripts/apply_temporal_definition_guard.py

      - name: Verify complete semantic grounding regression
        run: node semantic-grounding.test.js
