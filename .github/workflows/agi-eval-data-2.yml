name: AGI evaluation data ferry 2
on:
  push:
    branches: [agi-eval-data-20261018]
permissions:
  contents: read
jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ARC-AGI-1 public evaluation set
        run: |
          git clone --depth 1 https://github.com/fchollet/ARC-AGI.git arc-source
          mkdir -p eval-v1
          cp arc-source/data/evaluation/*.json eval-v1/
          sha256sum eval-v1/*.json > eval-v1/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arc-agi-1-evaluation
          path: eval-v1
          if-no-files-found: error
