name: AGI evaluation data ferry 2
on:
  push:
    branches: [agi-eval-data-20261018]
permissions:
  contents: read
jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public ARC evaluation set
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-2.git arc-source
          mkdir -p eval-all
          cp arc-source/data/evaluation/*.json eval-all/
          sha256sum eval-all/*.json > eval-all/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arc-evaluation-all
          path: eval-all
          if-no-files-found: error
